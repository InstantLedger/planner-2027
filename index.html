<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E2422">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ADHD Planner">
<title>2027 ADHD Budget & Life Planner | InstantLedger</title>
<style>
:root{
  --bg:#1E2422;--card:#2A322F;--card2:#33403A;--line:#3A4540;
  --text:#E4E9E4;--muted:#9AA59C;--accent:#A8C9A0;--accent-ink:#1E2422;
  --warm:#E8B98A;--danger:#E59A8C;--ok:#A8C9A0;--chip:#33403A;--chip-ink:#C5DCC0;
  --radius:14px;
}
body.light{
  --bg:#F3F5F1;--card:#FFFFFF;--card2:#E8EEE6;--line:#D7DFD4;
  --text:#24302A;--muted:#66746A;--accent:#4F7A47;--accent-ink:#FFFFFF;
  --warm:#B06A2C;--danger:#B4483A;--ok:#4F7A47;--chip:#E3ECE0;--chip-ink:#35552F;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.app{display:flex;min-height:100vh}
nav.side{width:220px;flex-shrink:0;padding:20px 14px;border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-weight:600;color:var(--accent);font-size:15px;margin:0 8px 18px;letter-spacing:.3px}
.brand small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.navbtn{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:10px 12px;border-radius:10px;text-align:left;color:var(--muted);font-size:15px}
.navbtn:hover{background:var(--card)}
.navbtn.on{background:var(--card2);color:var(--text)}
.navbtn .ic{width:20px;display:flex;justify-content:center}
.navbtn .soon{margin-left:auto;font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 5px}
main{flex:1;min-width:0;padding:24px 28px 110px;max-width:980px}
h1{font-size:24px;margin:0 0 4px;font-weight:600}
h2{font-size:17px;margin:0 0 10px;font-weight:600}
.sub{color:var(--muted);margin:0 0 18px;font-size:14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.card{background:var(--card);border-radius:var(--radius);padding:16px 18px}
.lbl{font-size:13px;color:var(--muted)}
.big{font-size:34px;font-weight:600;color:var(--accent);line-height:1.15}
.mid{font-size:22px;font-weight:600}
.bar{height:8px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:5px}
.bar.over>i{background:var(--danger)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.btn{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-size:15px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.ghost{background:none}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--chip);color:var(--chip-ink);border:1px solid transparent;border-radius:20px;padding:7px 13px;font-size:14px;margin:0 6px 8px 0}
.chip.on{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
input[type=text],input[type=number],input[type=date],select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;min-width:0}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.list{margin:0;padding:0;list-style:none}
.list li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.amt{margin-left:auto;font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--muted)}
.warm{color:var(--warm)}
.danger{color:var(--danger)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:6px}
.day{background:var(--card2);border-radius:10px;padding:6px 0;text-align:center;font-size:12px;color:var(--muted)}
.day b{display:block;font-size:16px;color:var(--text);font-weight:600}
.day.today{background:var(--accent);color:var(--accent-ink)}
.day.today b{color:var(--accent-ink)}
.day .mk{display:block;height:6px;margin-top:2px}
.day .mk i{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--warm)}
.prio{display:flex;align-items:center;gap:10px;padding:8px 0}
.prio input[type=text]{background:transparent;border:0;border-bottom:1px dashed var(--line);border-radius:0;padding:6px 2px}
.check{width:24px;height:24px;border-radius:7px;border:2px solid var(--accent);background:none;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--accent-ink);font-size:14px;padding:0}
.check.done{background:var(--accent)}
.prio.done input{text-decoration:line-through;color:var(--muted)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.keypad button{background:var(--card2);border:0;border-radius:12px;padding:16px 0;font-size:22px;font-weight:500}
.keypad button:active{transform:scale(.97)}
.amountShow{font-size:46px;font-weight:600;text-align:center;color:var(--accent);font-variant-numeric:tabular-nums;margin:6px 0}
table{width:100%;border-collapse:collapse;font-size:14px}
th{color:var(--muted);font-weight:500;text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td input{padding:5px 7px;font-size:14px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--accent);color:var(--accent-ink);padding:11px 18px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:50;display:flex;gap:14px;align-items:center;white-space:nowrap;max-width:92vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
.toast button{background:none;border:1px solid var(--accent-ink);color:var(--accent-ink);border-radius:8px;padding:3px 9px;font-size:13px}
footer.copy{margin-top:34px;font-size:12px;color:var(--muted);text-align:center}
.soonbox{text-align:center;padding:50px 20px}
.confirm{background:var(--card2);border:1px solid var(--danger);border-radius:12px;padding:12px 14px;margin-top:10px}
.donutwrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.legend{font-size:13px}
.legend div{display:flex;align-items:center;gap:8px;margin:3px 0}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{background:none;border:0;padding:6px 12px;border-radius:8px;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.incform{display:grid;grid-template-columns:1.4fr 1fr 1.2fr auto;gap:8px;margin-top:10px}
.morebtn{display:none}
button.day{font:inherit;cursor:pointer;color:var(--muted)}
label.lbl input{margin-top:4px}
details summary{padding:4px 0}
.notice{margin-bottom:14px;border:1px solid var(--warm)}
.notice b{color:var(--text)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:760px){
  nav.side{position:fixed;bottom:0;left:0;right:0;top:auto;width:auto;height:auto;padding:6px 4px calc(6px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line);background:var(--bg);display:flex;z-index:40;overflow-x:auto}
  .brand,.navbtn.extra{display:none}
  .morebtn{display:flex}
  nav.side.open{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
  nav.side.open .navbtn.extra{display:flex}
  .navbtn{flex-direction:column;gap:2px;font-size:11px;padding:6px 4px;justify-content:center;text-align:center;min-width:64px}
  .navbtn .ic{width:auto}
  .navbtn .soon{display:none}
  main{padding:18px 14px 110px}
  .incform{grid-template-columns:1fr 1fr}
  th.prog,td.prog{display:none}
  .habt td,.habt th{padding:6px 1px}
  .habt .check{width:22px;height:22px}
  .big{font-size:30px}
}
</style>
</head>
<body>
<div class="app">
  <nav class="side" id="nav" aria-label="Main"></nav>
  <main id="main"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" translate="no"></div>
<script>
(function(){
"use strict";
var KEY="il_adhd_planner_v1";
var CATS=[
  {id:"housing",name:"Housing",color:"#A8C9A0"},
  {id:"groceries",name:"Groceries",color:"#8FB8C9"},
  {id:"dining",name:"Dining out",color:"#E8B98A"},
  {id:"transport",name:"Transport",color:"#B9AEE8"},
  {id:"utilities",name:"Utilities",color:"#C9C48F"},
  {id:"fun",name:"Fun",color:"#E59AB4"},
  {id:"health",name:"Health",color:"#9FD6C4"},
  {id:"shopping",name:"Shopping",color:"#D9A7E0"},
  {id:"other",name:"Other",color:"#9AA59C"}
];
var SCREENS=[
  {id:"today",name:"Today",ic:"☀"},
  {id:"spend",name:"Quick Spend",ic:"⚡"},
  {id:"budget",name:"Budget",ic:"◔"},
  {id:"dump",name:"Brain Dump",ic:"✎",extra:true},
  {id:"planner",name:"Planner",ic:"▦",extra:true},
  {id:"bills",name:"Bills",ic:"✉",extra:true},
  {id:"debt",name:"Debt & Savings",ic:"↗",extra:true},
  {id:"habits",name:"Habits",ic:"✔",extra:true},
  {id:"goals",name:"2027 Goals",ic:"★",extra:true},
  {id:"settings",name:"Settings",ic:"⚙"}
];

var ICONS={"today": "<circle cx=\"12\" cy=\"12\" r=\"4\"/><path d=\"M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4\"/>", "spend": "<path d=\"M13 2L4 14h7l-1 8 9-12h-7l1-8z\"/>", "budget": "<path d=\"M12 3a9 9 0 1 0 9 9h-9z\"/><path d=\"M15 3.5A9 9 0 0 1 20.5 9H15z\"/>", "dump": "<path d=\"M4 20h4L19 9l-4-4L4 16z\"/><path d=\"M13.5 6.5l4 4\"/>", "planner": "<rect x=\"3\" y=\"5\" width=\"18\" height=\"16\" rx=\"2\"/><path d=\"M3 10h18M8 3v4M16 3v4\"/>", "bills": "<path d=\"M6 3h12v18l-3-2-3 2-3-2-3 2z\"/><path d=\"M9 8h6M9 12h6\"/>", "debt": "<path d=\"M3 17l6-6 4 4 8-8\"/><path d=\"M15 7h6v6\"/>", "habits": "<path d=\"M4 12l5 5L20 6\"/>", "goals": "<path d=\"M12 3l2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z\"/>", "more": "<circle cx=\"5\" cy=\"12\" r=\"1.5\"/><circle cx=\"12\" cy=\"12\" r=\"1.5\"/><circle cx=\"19\" cy=\"12\" r=\"1.5\"/>", "settings": "<circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 7 19.4a1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 3.6 14H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 9 4.6V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.6 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z\"/>"};
function icon(id,sz){return '<svg width="'+(sz||20)+'" height="'+(sz||20)+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ICONS[id]+'</svg>';}
function blank(){return {v:1,settings:{theme:"dark",weekStart:1,firstUse:iso(new Date()),lastBackup:"",hideInstall:false},incomes:[],expenses:[],limits:{},bills:[],top3:{},dump:[],blocks:{},debts:[],savings:[],habits:[],habitLog:{},goals:[]};}
var mem=null;
function load(){
  if(mem) return mem;
  var d=null;
  try{var raw=localStorage.getItem(KEY); if(raw) d=JSON.parse(raw);}catch(e){d=null;}
  mem=normalize(d||blank());
  return mem;
}
function normalize(d){
  var b=blank();
  if(!d||typeof d!=="object") return b;
  d.settings=Object.assign(b.settings,d.settings||{});
  ["incomes","expenses","bills","dump","debts","savings","habits","goals"].forEach(function(k){if(!Array.isArray(d[k]))d[k]=[];});
  if(!d.limits||typeof d.limits!=="object")d.limits={};
  ["top3","blocks","habitLog"].forEach(function(k){if(!d[k]||typeof d[k]!=="object"||Array.isArray(d[k]))d[k]={};});
  return d;
}
var saveOk=true;
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(mem));saveOk=true;}catch(e){saveOk=false;}
}

function pad(n){return (n<10?"0":"")+n;}
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function fromIso(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
function us(s){var p=s.split("-");return p[1]+"/"+p[2]+"/"+p[0];}
function monthKey(d){return d.getFullYear()+"-"+pad(d.getMonth()+1);}
var MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
var DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
function money(n){n=Math.round((+n||0)*100)/100;var neg=n<0;n=Math.abs(n);return (neg?"-":"")+"$"+n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});}
function money0(n){n=Math.round(+n||0);var neg=n<0;return (neg?"-":"")+"$"+Math.abs(n).toLocaleString("en-US");}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function cat(id){for(var i=0;i<CATS.length;i++)if(CATS[i].id===id)return CATS[i];return CATS[CATS.length-1];}

var state={screen:"today",month:monthKey(new Date()),amount:"",spendCat:"groceries",spendNote:"",confirmReset:false};

function applyTheme(){
  var d=load();
  document.body.classList.toggle("light",d.settings.theme==="light");
  var m=document.querySelector('meta[name=theme-color]');
  if(m)m.setAttribute("content",d.settings.theme==="light"?"#F3F5F1":"#1E2422");
}

var toastTimer=null;
function toast(msg,undoFn){
  var t=document.getElementById("toast");
  t.innerHTML=esc(msg)+(undoFn?' <button type="button" id="undoBtn">Undo</button>':"");
  t.classList.add("show");
  if(undoFn)document.getElementById("undoBtn").onclick=function(){undoFn();t.classList.remove("show");};
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){t.classList.remove("show");},undoFn?5000:2200);
}

function renderNav(){
  var h='<div class="brand">2027 ADHD Planner<small>by InstantLedger</small></div>';
  SCREENS.forEach(function(s){
    h+='<button type="button" class="navbtn'+(s.extra?" extra":"")+(state.screen===s.id?" on":"")+'" data-go="'+s.id+'"'+(state.screen===s.id?' aria-current="page"':'')+'><span class="ic">'+icon(s.id)+'</span><span>'+esc(s.name)+'</span>'+(s.soon?'<span class="soon">soon</span>':'')+'</button>';
  });
  h+='<button type="button" class="navbtn morebtn" id="moreBtn" aria-expanded="'+(state.more?'true':'false')+'"><span class="ic">'+icon('more')+'</span><span>More</span></button>';
  var nav=document.getElementById("nav");nav.innerHTML=h;nav.classList.toggle("open",!!state.more);
}

function monthTotals(mk){
  var d=load(),inc=0,sp=0,byCat={};
  d.incomes.forEach(function(x){if(x.date.slice(0,7)===mk)inc+=+x.amount||0;});
  d.expenses.forEach(function(x){if(x.date.slice(0,7)===mk){sp+=+x.amount||0;byCat[x.cat]=(byCat[x.cat]||0)+(+x.amount||0);}});
  var unpaid=0;
  d.bills.forEach(function(b){if(!(b.paid&&b.paid[mk]))unpaid+=+b.amount||0;});
  return {inc:inc,sp:sp,byCat:byCat,unpaid:unpaid,safe:inc-sp-unpaid};
}

function weekDays(base){
  var ws=load().settings.weekStart;
  var d=new Date(base.getFullYear(),base.getMonth(),base.getDate());
  var diff=(d.getDay()-ws+7)%7;
  d.setDate(d.getDate()-diff);
  var out=[];for(var i=0;i<7;i++){out.push(new Date(d.getFullYear(),d.getMonth(),d.getDate()+i));}
  return out;
}

function billDate(b,y,m){var last=new Date(y,m+1,0).getDate();return new Date(y,m,Math.min(+b.due||1,last));}

function billsThisWeek(){
  var d=load(),days=weekDays(new Date()),res=[];
  d.bills.forEach(function(b){
    days.forEach(function(day){
      var bd=billDate(b,day.getFullYear(),day.getMonth());
      if(iso(bd)===iso(day)){res.push({b:b,date:day,paid:!!(b.paid&&b.paid[monthKey(day)])});}
    });
  });
  return res;
}


function isStandalone(){try{return (window.matchMedia&&window.matchMedia("(display-mode: standalone)").matches)||window.navigator.standalone===true;}catch(e){return false;}}
function hasData(d){return d.expenses.length+d.incomes.length+d.bills.length+d.dump.length+d.debts.length+d.savings.length+d.habits.length+d.goals.length>0;}
function daysSince(isoStr){if(!isoStr)return 9999;return Math.floor((fromIso(iso(new Date()))-fromIso(isoStr))/86400000);}
var persistState="unknown";
function askPersist(){try{if(navigator.storage&&navigator.storage.persist){navigator.storage.persisted().then(function(p){if(p){persistState="on";return;}return navigator.storage.persist().then(function(g){persistState=g?"on":"off";});}).catch(function(){});}}catch(e){}}
function safetyBanners(){
  var d=load(),h="";
  var isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
  if(!isStandalone()&&!d.settings.hideInstall&&location.protocol==="https:"){
    h+='<div class="card notice" role="note"><div class="row between" style="align-items:flex-start"><div><b>Keep your data safe: add this planner to your home screen.</b><p class="lbl" style="margin:4px 0 0">'+(isIOS?'In Safari, tap Share, then Add to Home Screen.':'In Chrome, tap the \u22EE menu, then Install app or Add to Home screen.')+' Browsers can clear data for websites you don\u2019t open for a while. Home screen apps are kept.</p></div><button type="button" class="btn sm ghost" id="hideInstall" aria-label="Hide this tip">\u2715</button></div></div>';
  }
  var lb=d.settings.lastBackup,since=daysSince(lb),used=daysSince(d.settings.firstUse);
  if(hasData(d)&&((lb&&since>=7)||(!lb&&used>=3))){
    h+='<div class="card notice" role="note"><div class="row between" style="flex-wrap:wrap;gap:8px"><div><b>'+(lb?'Your last backup was '+since+' days ago.':'You haven\u2019t made a backup yet.')+'</b><p class="lbl" style="margin:4px 0 0">A backup file protects your entries if your browser data is cleared.</p></div><button type="button" class="btn pri sm" data-go="settings">Back up now</button></div></div>';
  }
  return h;
}
function renderToday(){
  var d=load(),now=new Date(),tk=iso(now),mk=monthKey(now),t=monthTotals(mk);
  var p=d.top3[tk]||[{t:"",done:false},{t:"",done:false},{t:"",done:false}];
  var doneN=p.filter(function(x){return x.done&&x.t;}).length;
  var spentPct=t.inc>0?Math.min(100,Math.round((t.sp+t.unpaid)/t.inc*100)):0;
  var days=weekDays(now),bw=billsThisWeek();
  var todaySpent=0;d.expenses.forEach(function(x){if(x.date===tk)todaySpent+=+x.amount||0;});
  var h='<h1>Today</h1><p class="sub">'+DOW[now.getDay()]+", "+us(tk)+'</p>'+safetyBanners();
  h+='<div class="grid g2">';
  h+='<div class="card"><div class="lbl">Safe to spend this month</div><div class="big'+(t.safe<0?' danger':'')+'">'+money0(t.safe)+'</div><div class="bar'+(spentPct>=100?' over':'')+'"><i style="width:'+(100-spentPct)+'%"></i></div><div class="lbl" style="margin-top:8px">Income '+money0(t.inc)+' · spent '+money0(t.sp)+' · bills left '+money0(t.unpaid)+'</div></div>';

  if(el.dataset.mon!==undefined){var dir=+el.dataset.mon;if(dir===0)state.month=monthKey(new Date());else{var p=state.month.split("-");state.month=monthKey(new Date(+p[0],+p[1]-1+dir,1));}render();return;}
  if(el.id==="addInc"){var nm=document.getElementById("incName").value.trim(),am=parseFloat(document.getElementById("incAmt").value),dtv=document.getElementById("incDate").value,er2=document.getElementById("incErr");
    if(!nm){er2.textContent="Enter a name, like Paycheck.";return;}if(!(am>0)){er2.textContent="Enter an amount above $0.";return;}if(am>10000000){er2.textContent="That amount looks too big. Check the number.";return;}if(!/^\d{4}-\d{2}-\d{2}$/.test(dtv)){er2.textContent="Pick a date.";return;}
    d.incomes.push({id:uid(),name:nm,amount:Math.round(am*100)/100,date:dtv});save();state.month=dtv.slice(0,7);render();toast("Income added");return;}
  if(el.dataset.theme){d.settings.theme=el.dataset.theme;save();render();return;}
  if(el.dataset.ws!==undefined){d.settings.weekStart=+el.dataset.ws;save();render();toast("Week now starts on "+(d.settings.weekStart===1?"Monday":"Sunday"));return;}
  if(el.id==="backup"){try{var blob=new Blob([JSON.stringify(d,null,1)],{type:"application/json"});var a2=document.createElement("a");a2.href=URL.createObjectURL(blob);a2.download="adhd-planner-backup-"+iso(new Date())+".json";document.body.appendChild(a2);a2.click();setTimeout(function(){URL.revokeObjectURL(a2.href);a2.remove();},500);d.settings.lastBackup=iso(new Date());save();render();document.getElementById("bkMsg").textContent="Backup downloaded. Keep the file somewhere safe.";}catch(err){document.getElementById("bkMsg").textContent="Backup failed in this browser.";}return;}
  if(el.id==="sample"){sample();go("today");toast("Sample data loaded");return;}
  if(el.id==="resetAsk"){state.confirmReset=true;render();return;}
  if(el.id==="resetNo"){state.confirmReset=false;render();return;}
  if(el.id==="resetYes"){var ks=d.settings;mem=blank();mem.settings=ks;save();state.confirmReset=false;render();toast("All data erased");return;}
});

document.addEventListener("change",function(e){
  var el=e.target,d=load();
  if(el.dataset.topt!==undefined){var tk=iso(new Date());if(!d.top3[tk])d.top3[tk]=[{t:"",done:false},{t:"",done:false},{t:"",done:false}];d.top3[tk][+el.dataset.topt].t=el.value.trim().slice(0,80);save();return;}
  if(el.dataset.limit){var v=parseFloat(el.value);if(v>0)d.limits[el.dataset.limit]=Math.round(v);else delete d.limits[el.dataset.limit];save();render();return;}
  if(el.id==="restoreFile"&&el.files&&el.files[0]){var f=el.files[0],r=new FileReader();r.onload=function(){var msg=document.getElementById("bkMsg");try{var obj=JSON.parse(r.result);if(!obj||typeof obj!=="object"||!Array.isArray(obj.expenses))throw 0;var prevMem=JSON.parse(JSON.stringify(mem));mem=normalize(obj);save();render();toast("Backup restored",function(){mem=prevMem;save();render();});}catch(err){if(msg)msg.textContent="That file isn’t a planner backup.";}};r.readAsText(f);return;}
});
document.addEventListener("keydown",function(e){if(e.key!=="Enter")return;var m={dumpIn:"dumpAdd",habName:"habAdd",goalTitle:"goalAdd",blkText:"blkAdd"}[e.target.id];if(m){e.preventDefault();var b=document.getElementById(m);if(b)b.click();}});
document.addEventListener("input",function(e){if(e.target.id==="spendNote")state.spendNote=e.target.value;});

askPersist();
render();
if("serviceWorker" in navigator&&location.protocol==="https:"){try{navigator.serviceWorker.register("sw.js");}catch(e){}}
})();
</script>
</body>
</html>
